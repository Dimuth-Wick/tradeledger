<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- TradeLedger logo: three white candlesticks climbing on an orange
       tile; the tallest ends in an arrow tip (momentum). Source for all
       app icons: `npx tauri icon backend/icons/app-icon.svg`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb21e"/>
      <stop offset="0.55" stop-color="#ff7417"/>
      <stop offset="1" stop-color="#f2450f"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#shine)"/>

  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round">
    <!-- Candle 1 (short) -->
    <line x1="292" y1="548" x2="292" y2="812" stroke-width="30"/>
    <rect x="232" y="598" width="120" height="166" rx="28" stroke="none"/>

    <!-- Candle 2 (taller) -->
    <line x1="512" y1="396" x2="512" y2="772" stroke-width="30"/>
    <rect x="452" y="446" width="120" height="250" rx="28" stroke="none"/>

    <!-- Candle 3 (tallest, arrow tip) -->
    <line x1="732" y1="560" x2="732" y2="732" stroke-width="30"/>
    <rect x="672" y="318" width="120" height="314" rx="28" stroke="none"/>
    <path d="M732 168 L842 330 L622 330 Z" stroke-width="24" stroke-linejoin="round"/>
  </g>
</svg>
