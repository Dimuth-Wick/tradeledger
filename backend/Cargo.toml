[package]
name = "tradeledger"
version = "1.1.0"
description = "Offline crypto trading journal"
authors = ["Dimuth-Wick"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tradeledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite. "bundled" compiles SQLite into the app so users need nothing installed.
# Version must match the one rusqlite_migration is built against.
# "backup": copies a restored database into the open one (SQLite online backup).
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
# Versioned schema changes (PRAGMA user_version), applied on startup.
rusqlite_migration = "2.7.0"
# Typed error enums with less boilerplate.
thiserror = "2.0.21"
# Exact decimal money math (never f64). "serde" sends values to the UI as
# strings, so JavaScript can't round them.
rust_decimal = { version = "1.43.0", features = ["serde"] }
# Reads exchange CSV exports (handles quoting, BOM, line numbers).
csv = "1.4.0"
# SHA-256 fingerprint of each imported row (dedupe_hash).
sha2 = "0.11.1"
# Parses "2026-01-05 09:15:02" (UTC) export timestamps. No default features:
# we only parse, we never read the system clock or time zone database here.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# Backup files: the database and screenshots in one .zip (deflate only).
zip = { version = "9.7.1", default-features = false, features = ["deflate"] }
# Windows Save/Open dialogs for choosing backup and CSV files.
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
# dec!(1.25) literals in tests.
rust_decimal_macros = "1.40.0"
