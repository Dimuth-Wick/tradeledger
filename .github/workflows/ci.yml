# Checks every push and pull request: the same commands we run locally.
# A red ❌ on GitHub means one of them failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux needs the system WebView and a few libraries to compile.
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: UI lint, format and tests
        run: |
          npm run lint
          npm run format:check
          npm test

      # Also produces dist/, which the Rust build embeds.
      - name: UI build
        run: npm run build

      - name: Rust format, lint and tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
