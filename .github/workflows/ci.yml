# Checks every push and pull request: the same commands we run locally.
# A red ❌ on GitHub means one of them failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Tauri on Linux needs the system WebView and a few libraries to compile.
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # same as development (npm 11 wrote package-lock.json)
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # On failure, npm's own error lines are posted as an annotation, so
      # they can be read on the run page without opening the full log.
      - name: Install npm packages
        shell: bash
        run: |
          set +e +o pipefail
          npm ci > npm-ci.log 2>&1
          status=$?
          cat npm-ci.log
          if [ "$status" -ne 0 ]; then
            echo "::error title=npm ci failed::$(tail -n 15 npm-ci.log | paste -sd '|')"
            exit 1
          fi

      - name: UI lint, format and tests
        run: |
          npm run lint
          npm run format:check
          npm test

      # Also produces dist/, which the Rust build embeds.
      - name: UI build
        run: npm run build

      - name: Rust format, lint and tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
